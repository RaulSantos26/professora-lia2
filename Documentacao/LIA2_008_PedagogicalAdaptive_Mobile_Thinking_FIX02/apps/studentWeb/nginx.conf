server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 52m;

    location /api/ {
        proxy_pass http://lia2-backend:8000/;
        proxy_http_version 1.1;

        # Local LLM generation can legitimately take longer than the
        # nginx default read timeout. The backend remains the authoritative
        # execution timeout and returns a structured Error.v1.
        proxy_connect_timeout 30s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
